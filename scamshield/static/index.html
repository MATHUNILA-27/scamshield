<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamShield</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Noto+Sans:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--ink:#14232e;--mute:#53656f;--card:#fff;--line:#cfd9e0;--teal:#0f4c5c;--safe:#2e7d5b;--warn:#b87503;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Noto Sans","Noto Sans Tamil","Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 20px 64px}
h1{font:800 clamp(28px,6vw,42px)/1.15 "Bricolage Grotesque","Noto Sans Tamil","Noto Sans Devanagari",sans-serif;margin:0 0 8px}
h2{font:800 24px/1.2 "Bricolage Grotesque","Noto Sans Tamil","Noto Sans Devanagari",sans-serif;margin:0 0 6px}
h3{font-size:19px;margin:0 0 6px}
.mute{color:var(--mute)}
textarea{width:100%;min-height:140px;padding:14px;font:inherit;border:2px solid var(--line);border-radius:10px;background:var(--card)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
button,select{font:inherit;padding:10px 16px;border-radius:8px;border:2px solid var(--teal);background:#fff;color:var(--teal);cursor:pointer}
button.go{background:var(--teal);color:#fff;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
.ex button{font-size:15px;padding:5px 11px;border-color:var(--line);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:24px}
.head{padding:20px 24px;color:#fff}.head p{margin:2px 0 0}
.likely_scam{background:var(--bad)}.suspicious{background:var(--warn)}.no_signs_found{background:var(--safe)}
.bar{height:8px;background:rgba(255,255,255,.35);margin-top:12px;border-radius:4px}.bar i{display:block;height:100%;background:#fff;border-radius:4px}
section{padding:16px 24px;border-top:1px solid var(--line)}
ul{margin:0;padding-left:22px}li{margin:4px 0}
.chip{display:inline-block;background:#e3edf1;border-radius:99px;padding:2px 12px;margin:3px 6px 3px 0;font-size:16px}
.link{border-left:4px solid var(--line);padding:2px 12px;margin:8px 0;word-break:break-all}.link.flag{border-color:var(--bad)}
.highlighted{background:#fff0a8;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.highlighted.url{background:#dcecff;text-decoration-style:dashed}
.highlight-text{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:8px;padding:12px;background:#f8fafb}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.note{background:#fff4d6;border:1px solid #e8c766;border-radius:8px;padding:8px 12px;margin:12px 0;font-size:16px}
.tip{border-left:6px solid var(--teal);background:#e3edf1;padding:12px 16px;border-radius:8px;margin:12px 0}
.call-open{font-size:1.15em;padding:14px 20px}
.prepay-shell{margin-top:12px;padding:20px 24px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.prepay-btn{display:block;width:100%;font-size:1.2em;padding:18px 20px;margin-bottom:12px}
.prepay-progress{height:12px;border-radius:999px;background:#dfe7ed;overflow:hidden}
.prepay-progress i{display:block;height:100%;background:var(--teal);transition:width .2s}
.prepay-question{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:700;line-height:1.3;min-height:3.5em;margin:14px 0}
.prepay-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.prepay-row button{flex:1 1 180px;font-size:1.3em;padding:18px 20px;min-height:68px}
.prepay-alert{position:fixed;inset:0;background:#101820;color:#fff;z-index:20;padding:clamp(20px,6vw,50px);display:flex;align-items:center;justify-content:center}
.prepay-alert-inner{width:min(760px,100%);background:#101820;border:2px solid #fff;border-radius:18px;padding:clamp(16px,3vw,30px)}
.prepay-alert h2{font-size:clamp(2.2rem,7vw,4rem);margin:0 0 16px;color:#ffe05c}
.prepay-alert ul{padding-left:20px}.prepay-alert li{margin:10px 0}
.prepay-note{margin-top:12px;padding:12px 14px;border-radius:10px;background:#e3edf1;color:#1a2d36}
.prepay-timer{font-size:1.8em;font-weight:700}
body.easy-read{font-size:1.08rem}body.easy-read main{max-width:900px}body.easy-read button,body.easy-read select,body.easy-read textarea,body.easy-read input{font-size:1.06rem}
.call-question{font-size:1.25em;font-weight:600;min-height:3em}
#callChoices{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.call-answer{font-size:1.25em;min-width:120px;padding:16px 24px;flex:1 1 180px;margin:0}
.call-meter{height:18px;background:#d5dde1;border-radius:9px;overflow:hidden}
.call-meter i{display:block;height:100%;width:0;background:#bf5200;transition:width .2s}
.call-alert .call-meter{background:#53616a}
.call-alert .call-meter i{background:#ffe05c}
.call-alert{position:fixed;inset:0;z-index:10;overflow:auto;background:#101820;color:#fff;padding:clamp(24px,7vw,72px);display:flex;flex-direction:column;justify-content:center}
.call-alert h2{font-size:clamp(36px,9vw,64px);color:#ffe05c}
.call-alert li{margin:14px 0;font-size:1.15em}
.call-alert .script{font-size:1.3em;font-weight:600;border:2px solid #ffe05c;padding:14px;border-radius:8px}
.call-alert button{font-weight:700}
.call-alert button.go{background:#ffe05c;color:#101820;border-color:#ffe05c}
.call-alert button:not(.go){background:#fff;color:#101820;border-color:#fff}
.contact-form{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.contact-form summary{cursor:pointer;color:var(--teal);font-weight:700}
.contact-form summary h3{display:inline}
.contact-intro{margin:8px 0}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.contact-grid label{display:block;font-size:16px}
.contact-grid input{display:block;width:100%;padding:9px;border:2px solid var(--line);border-radius:8px;font:inherit}
.contact-actions a,.contact-actions button{display:inline-block;font-size:1.15em;font-weight:700;padding:14px 20px;text-decoration:none}
.contact-actions a{background:var(--teal);border:2px solid var(--teal);border-radius:8px;color:white}
.contact-actions{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin:10px 0 16px}
.contact-actions a,.contact-actions button{max-width:100%;white-space:normal}
.contact-status{min-height:1.6em}
.score-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.score-grid>div{border:1px solid var(--line);border-radius:8px;padding:10px}
.score-grid strong{display:block;font-size:1.3em}
.pause-clock{font-size:1.6em;font-weight:700;font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:560px){.contact-grid{grid-template-columns:1fr}}
@media(max-width:420px){.score-grid{grid-template-columns:1fr}}
label.q{display:block;padding:6px 0}label.q input{width:22px;height:22px;vertical-align:middle;margin-right:8px}
.g{border-left:6px solid var(--teal);padding:2px 14px;margin:14px 0}.g.now{border-color:var(--bad)}
.hide{display:none}
</style></head><body><main>
<div class="row" style="justify-content:flex-end"><label for="lang" class="mute">Language</label>
<select id="lang"><option value="en">English</option><option value="ta">தமிழ்</option><option value="hi">हिन्दी</option></select></div>
<div id="unrev" class="note hide" data-t="unrev"></div>
<h1 data-t="title"></h1><p class="mute" data-t="sub"></p>
<div class="row"><button class="go call-open" id="openCall" data-t="callOpen"></button></div>
<div class="prepay-shell" id="prepayWrap">
 <button class="go prepay-btn" id="prepayOpen" data-t="prepayOpen"></button>
 <div id="prepayPanel" class="hide">
  <p id="prepayProgressText" class="mute"></p>
  <div class="prepay-progress" aria-label="Pre-pay check progress"><i id="prepayProgressBar" style="width:0%"></i></div>
  <p id="prepayQuestion" class="prepay-question" tabindex="-1"></p>
  <div class="prepay-row"><button class="go" id="prepayYes" data-t="prepayYes"></button><button id="prepayNo" data-t="prepayNo"></button></div>
 </div>
 <div id="prepayAlert" class="prepay-alert hide" role="alertdialog" aria-modal="true" aria-labelledby="prepayAlertTitle">
  <div class="prepay-alert-inner">
   <h2 id="prepayAlertTitle" data-t="prepayStop"></h2>
   <p id="prepayRiskText" class="mute"></p>
   <ul id="prepayReasons"></ul>
   <ol>
    <li data-t="prepayStepWait"></li>
    <li data-t="prepayStepCall"></li>
    <li data-t="prepayStepAsk"></li>
   </ol>
   <p class="prepay-note" data-t="prepayNote"></p>
   <p id="prepayTimerText" class="prepay-timer" aria-live="polite"></p>
   <div class="prepay-row"><button class="go" id="prepayFamily" data-t="prepayFamily"></button><button id="prepayPaid" data-t="prepayPaid"></button><button id="prepayShield" class="hide" data-t="prepayShield"></button></div>
  </div>
 </div>
 <div id="prepayCalm" class="hide">
  <h3 data-t="prepayCalmTitle"></h3>
  <p data-t="prepayCalmText"></p>
 </div>
</div>
<div class="card hide" id="callPage" aria-live="polite" style="padding:20px 24px">
 <div class="row" style="justify-content:space-between"><h2 data-t="callTitle"></h2><button id="callBack" data-t="callBack"></button></div>
 <p id="callUnrev" class="note hide" data-t="unrev"></p>
 <p class="mute" data-t="callLimit"></p>
 <p class="mute" data-t="callPrivacy"></p>
 <div class="tip"><strong data-t="tipTitle"></strong><div data-t="tipBody"></div></div>
 <div id="callQuiz">
  <p id="callProgress" class="mute"></p>
  <p id="callQuestion" class="call-question" tabindex="-1"></p>
  <div class="call-meter" id="callProgressbar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="callMeter"></i></div>
  <p id="callRisk" class="mute"></p>
  <div id="callChoices" class="row"><button class="go call-answer" id="callYes"></button><button class="call-answer" id="callNo"></button><button class="call-answer" id="callOther"></button></div>
  <div id="callOtherForm" class="hide">
   <label for="callOtherText" data-t="callOtherLabel"></label>
   <textarea id="callOtherText" maxlength="300"></textarea>
   <p class="mute" data-t="callOtherPrivacy"></p><p class="note" data-t="callOtherGuidance"></p>
   <div class="row"><button class="go" id="callOtherContinue" data-t="callOtherContinue"></button><button id="callOtherBack" data-t="callOtherBack"></button></div>
  </div>
  <div id="callOtherResponse" class="hide" aria-live="polite" tabindex="-1">
   <h3 data-t="callOtherResponseTitle"></h3>
   <p id="callOtherNote" class="highlight-text"></p>
   <p data-t="callOtherResponseLimit"></p>
   <ul id="callOtherSteps"></ul>
   <div id="callOtherScenarioWrap" class="hide">
    <p data-t="callScenarioPrompt"></p>
    <div id="callOtherScenarioChoices" class="row"></div>
    <ol id="callOtherScenarioSteps"></ol>
   </div>
   <button class="go" id="callOtherNext" data-t="callOtherNext"></button>
  </div>
  <div id="callAdvice"></div>
 </div>
 <div id="callCalm" class="hide">
  <h3 data-t="callCalm"></h3><p data-t="callVerify"></p><div id="callCalmAdvice"></div>
  <div class="row"><button class="go" id="callAgain" data-t="callAgain"></button></div>
 </div>
</div>

<label for="t" data-t="label" class="mute"></label>
<textarea id="t"></textarea>
<p class="mute" style="font-size:16px;margin:4px 0" data-t="digits"></p>
<div class="row"><button class="go" id="go"></button></div>
<div class="row ex"><span class="mute" data-t="ex"></span><span id="exb"></span></div>

<div class="card hide" id="out" aria-live="polite">
 <div class="head" id="head"><h2 id="v"></h2><p id="st"></p><div class="bar"><i id="b"></i></div></div>
 <section><h3 data-t="scorePanelTitle"></h3><div class="score-grid">
  <div><span data-t="ruleScoreLabel"></span><strong id="ruleScore"></strong></div>
  <div><span data-t="aiScoreLabel"></span><strong id="aiScore"></strong></div>
  <div><span data-t="finalScoreLabel"></span><strong id="finalScore"></strong></div>
 </div><p id="scoreReason"></p></section>
 <section id="pausePanel" class="hide" aria-labelledby="pauseTitle">
  <h3 id="pauseTitle" data-t="pauseTitle"></h3><p data-t="pauseText"></p>
  <p id="pauseClock" class="pause-clock" aria-hidden="true"></p><p id="pauseStatus" class="sr-only" role="status" aria-live="polite"></p>
  <div class="row"><button class="go" id="pauseSkip" data-t="pauseSkip"></button><button id="pauseFamily" data-t="pauseFamily"></button></div>
 </section>
 <section><h3 data-t="highlightTitle"></h3><p id="highlight" class="highlight-text"></p><p id="highlightTip" class="mute" aria-live="polite"></p><p id="noSpanNote" class="mute hide"></p><div id="legend" class="legend"></div></section>
 <section><h3 data-t="why"></h3><ul id="why"></ul><div id="tac"></div></section>
 <section id="lk"><h3 data-t="links"></h3><div id="links"></div></section>
 <section><h3 data-t="todo"></h3><ul id="todo"></ul></section>
 <section><div id="aiNote" class="mute" style="font-size:16px"></div><div class="row"><button id="warn"></button></div></section>
</div>

<div class="card" style="padding:20px 24px">
 <h2 data-t="rh"></h2><p class="mute" data-t="rsub"></p>
 <label class="q"><input type="checkbox" value="money"><span data-t="q1"></span></label>
 <label class="q"><input type="checkbox" value="creds"><span data-t="q2"></span></label>
 <label class="q"><input type="checkbox" value="link"><span data-t="q3"></span></label>
 <label class="q"><input type="checkbox" id="hour"><span data-t="q4"></span></label>
 <p class="mute contact-intro" data-t="contactsIntro"></p>
 <details class="contact-form" id="contactForm">
  <summary><h3 data-t="contactsSummary"></h3></summary>
  <p class="mute" data-t="contactsPrivacy"></p>
  <div class="contact-grid">
   <label><span data-t="bankName"></span><input id="bankName" maxlength="80" autocomplete="organization"></label>
   <label><span data-t="bankPhone"></span><input id="bankPhone" type="tel" inputmode="tel" maxlength="30" autocomplete="tel"></label>
   <label><span data-t="familyName"></span><input id="familyName" maxlength="80" autocomplete="name"></label>
   <label><span data-t="familyPhone"></span><input id="familyPhone" type="tel" inputmode="tel" maxlength="30" autocomplete="tel"></label>
  </div>
  <p id="contactStatus" class="contact-status mute" role="status" aria-live="polite"></p>
  <div class="row"><button class="go" id="saveContacts" data-t="saveContacts"></button><button id="clearContacts" data-t="clearContacts"></button></div>
 </details>
 <div class="row"><button class="go" id="mk" data-t="plan"></button></div>
 <div id="plan" class="hide" aria-live="polite">
  <p><strong data-t="reassure"></strong></p><div id="contactActions" class="contact-actions"></div><div id="groups"></div>
  <h3 data-t="notes"></h3><p class="mute" style="font-size:16px" data-t="notesh"></p>
  <textarea id="notes" style="min-height:260px"></textarea>
  <div class="row"><button id="cp"></button></div>
  <p class="mute" style="font-size:15px"><span data-t="disc"></span><span id="gd"></span></p>
 </div>
</div>
</main>
<div id="callAlert" class="call-alert hide" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle">
 <h2 id="alertTitle" data-t="hangup"></h2>
 <p id="alertRiskText"></p><div class="call-meter" id="alertRiskBar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="alertRiskMeter"></i></div>
 <div id="callAlertAdvice" tabindex="-1" aria-live="polite"></div>
 <ol id="callCommonSteps"><li data-t="stepHangup"></li><li data-t="stepCallback"></li><li data-t="stepCode"></li></ol>
 <p id="callScript" class="script" data-t="callScript"></p>
 <p data-t="reassure"></p>
 <div class="row"><button class="go" id="paid" data-t="callPaid"></button><button id="callWarn" data-t="callWarn"></button></div>
</div>
<script>

en:{title:"Got a strange message? Check it first.",sub:"Paste an SMS, email or WhatsApp message. You get a verdict, the reasons and what to do next.",label:"Message to check",check:"Check message",checking:"Checking...",ex:"Try an example:",lv:"Likely a scam",vs:"Suspicious, be careful",vn:"No scam signs found. Still verify with the official source.",risk:"Risk",why:"Why",links:"Links found",todo:"What to do now",aioff:"AI is off. Checks for Tamil and Hindi messages are weaker.",aion:"Checked with AI and rules.",digits:"Never paste a live OTP. Long numbers are hidden before the AI sees them.",rh:"Already clicked, shared a code or paid?",rsub:"Tick what happened to get a step-by-step plan.",q1:"I sent money",q2:"I shared an OTP, PIN or card details",q3:"I clicked a link or installed an app",q4:"This happened in the last hour",plan:"Show my plan",gn:"Right now (first 10 minutes)",gnu:"Right now: every minute counts",gt:"Today",gr:"Report and keep evidence",reassure:"This is not your fault. You can ask a family member to help you make these calls.",disc:"General guidance, not legal or financial advice. Guidance last checked: ",notes:"Complaint notes (stay in your browser)",notesh:"Use this to help you fill in the official form at cybercrime.gov.in.",copy:"Copy",copied:"Copied",warn:"Copy warning for family",unrev:"Tamil and Hindi wording: not yet reviewed by a native speaker.",err:"Could not check the message. Make sure the server is running.",pick:"Tick at least one box.",f:["Name","Mobile","Nearest police station","District","Bank","Amount","Account or UPI ID","Transaction IDs","Scammer's number or link","Date and time"],what:"What happened",wm:'Scam alert! I got this message: "{m}". It is a scam. Do not click anything and never share an OTP. If money is lost, call 1930.',e:["Bank KYC","Family emergency","Parcel fee","Real OTP","Tamil","Hindi"]},
ta:{title:"விசித்திரமான செய்தி வந்ததா? முதலில் சரிபாருங்கள்.",sub:"SMS, மின்னஞ்சல் அல்லது WhatsApp செய்தியை ஒட்டவும். முடிவு, காரணங்கள், அடுத்து செய்ய வேண்டியவை கிடைக்கும்.",label:"சரிபார்க்க வேண்டிய செய்தி",check:"செய்தியை சரிபார்",checking:"சரிபார்க்கிறது...",ex:"உதாரணங்கள்:",lv:"மோசடி போலத் தெரிகிறது",vs:"சந்தேகத்திற்குரியது, கவனம்",vn:"மோசடி அறிகுறி இல்லை. இருந்தாலும் அதிகாரப்பூர்வ வழியில் உறுதி செய்யவும்.",risk:"ஆபத்து",why:"ஏன்",links:"இணைப்புகள்",todo:"இப்போது செய்ய வேண்டியவை",aioff:"AI அணைந்துள்ளது. தமிழ், ஹிந்தி செய்திகளுக்கான சோதனை பலவீனமாக இருக்கும்.",aion:"AI மற்றும் விதிகளால் சரிபார்க்கப்பட்டது.",digits:"உண்மையான OTP ஐ ஒட்ட வேண்டாம். நீண்ட எண்கள் AI பார்க்கும் முன் மறைக்கப்படும்.",rh:"இணைப்பைத் திறந்தீர்களா, குறியீடு பகிர்ந்தீர்களா, பணம் அனுப்பினீர்களா?",rsub:"நடந்ததைத் தேர்ந்தெடுத்தால் படிப்படியான திட்டம் கிடைக்கும்.",q1:"பணம் அனுப்பினேன்",q2:"OTP, PIN அல்லது அட்டை விவரங்களை பகிர்ந்தேன்",q3:"இணைப்பைத் திறந்தேன் அல்லது செயலியை நிறுவினேன்",q4:"இது கடந்த ஒரு மணி நேரத்தில் நடந்தது",plan:"என் திட்டத்தைக் காட்டு",gn:"இப்போதே (முதல் 10 நிமிடம்)",gnu:"இப்போதே: ஒவ்வொரு நிமிடமும் முக்கியம்",gt:"இன்றே",gr:"புகார் செய்து ஆதாரங்களை வைத்திருங்கள்",reassure:"இது உங்கள் தவறு அல்ல. இந்த அழைப்புகளைச் செய்ய குடும்ப உறுப்பினரிடம் உதவி கேட்கலாம்.",disc:"பொதுவான வழிகாட்டுதல் மட்டுமே; சட்ட அல்லது நிதி ஆலோசனை அல்ல. கடைசியாகச் சரிபார்த்த தேதி: ",notes:"புகார் குறிப்புகள் (உங்கள் உலாவியிலேயே இருக்கும்)",notesh:"cybercrime.gov.in அதிகாரப்பூர்வ படிவத்தை நிரப்ப இதைப் பயன்படுத்தவும்.",copy:"நகலெடு",copied:"நகலெடுக்கப்பட்டது",warn:"குடும்பத்திற்கு எச்சரிக்கை நகலெடு",unrev:"தமிழ், ஹிந்தி வார்த்தைகளை தாய்மொழி பேசுபவர் இன்னும் சரிபார்க்கவில்லை.",err:"செய்தியைச் சரிபார்க்க முடியவில்லை. சர்வர் இயங்குகிறதா எனப் பாருங்கள்.",pick:"குறைந்தது ஒன்றைத் தேர்ந்தெடுக்கவும்.",f:["பெயர்","மொபைல்","அருகிலுள்ள காவல் நிலையம்","மாவட்டம்","வங்கி","தொகை","கணக்கு அல்லது UPI ஐடி","பரிவர்த்தனை எண்கள்","மோசடிக்காரரின் எண் அல்லது இணைப்பு","தேதி, நேரம்"],what:"என்ன நடந்தது",wm:'மோசடி எச்சரிக்கை! எனக்கு இந்தச் ச Object.assign(T.ta,{
 prepayOpen:"யாரிடமாவது பணம் கொடுக்க வேண்டுமா? முதலில் சரிபாருங்கள்.",prepayYes:"ஆம்",prepayNo:"இல்லை",prepayStop:"நிறுத்துங்கள். பணம் இப்போது கொடுக்க வேண்டாம்.",prepayCalmTitle:"இந்த கேள்விகள் எந்த எச்சரிக்கையும் காட்டவில்லை.",prepayCalmText:"நீங்கள் அறிந்த நபர்களுக்கு மட்டுமே பணம் கொடுங்கள்; பணம் செலுத்தும் செயலியில் பெயரை சரிபார்த்த பிறகே கொடுங்கள்.",prepayFamily:"குடும்பத்துக்கு எச்சரிக்கை நகலெடு",prepayPaid:"ஏற்கெனவே பணம் கொடுத்தேன்",prepayShield:"Call Shield",prepayNote:"இது சூழ்நிலையைப் பார்க்கிறது; நபரை அல்ல. பணம் கொடுக்க வேண்டிய நபர் நம்பகமானவர் என்று சொல்ல முடியாது.",prepayStepWait:"காத்திருக்கவும். இப்போது பணம் கொடுக்க வேண்டாம்.",prepayStepCall:"அந்த நபர் அல்லது நிறுவனம் ஏற்கெனவே சேமித்த எண்ணில் அல்லது அதிகாரப்பூர்வ இணையதளத்தில் திரும்ப அழைத்துச் சொல்லுங்கள்; அவர்கள் கொடுத்த எண்ணைப் பயன்படுத்த வேண்டாம்.",prepayStepAsk:"தீர்மானிக்கும் முன் குடும்ப உறுப்பினரிடம் கேளுங்கள்.",prepayWarning:"பண எச்சரிக்கை: எனக்கு விரைவாக பணம் கொடுக்கச் சொன்னார்கள். நான் இன்னும் பணம் கொடுக்கவில்லை. ஏற்கெனவே சேமித்த எண்ணில் அல்லது அதிகாரப்பூர்வ இணையதளத்தில் திரும்ப அழைப்பேன். முடிவெடுக்கும் முன் குடும்ப உறுப்பினரிடம் கேட்பேன்.",prepayAlert:"இந்த பதில்கள் எச்சரிக்கை அறிகுறிகளாக உள்ளன:",callOpen:"இப்போது சந்தேகமான அழைப்பில் இருக்கிறீர்களா?",callTitle:"அழைப்பு பாதுகாப்பு",callBack:"Call Shield ஐ மூடு",callLimit:"Call Shield அழைப்பின் சூழ்நிலையைப் பார்க்கிறது; குரலை அல்ல. குரல் நகலைக் கண்டறிவதாக நாங்கள் கூறவில்லை. குரல் உண்மையாகக் கேட்டாலும், சேமித்த எண்ணில் திரும்ப அழைப்பதும் குடும்ப ரகசியச் சொல்லும் உதவும்.",callPrivacy:"அழைப்பைக் கேட்கவோ பதிவு செய்யவோ மைக்ரோஃபோனைப் பயன்படுத்தவோ மாட்டோம். அழைப்புத் தகவல் எதுவும் எங்கும் அனுப்பப்படாது.",

function renderHighlights(text,d){
 const root=$("highlight"),legend=$("legend"),note=$("noSpanNote"),tip=$("highlightTip"),chars=Array.from(text);
 const items=[...(d.spans?.tactics||[]).map(s=>({...s,kind:"tactic",label:s.tactic})),
  ...(d.spans?.urls||[]).map(s=>({...s,kind:"url",label:tt("linkLabel")}))]
 const merged=mergeSpans(items,chars.length);
 root.replaceChildren();legend.replaceChildren();tip.textContent="";note.classList.toggle("hide",items.length>0);
 if(!items.length){
  root.textContent=text;
  if(d.verdict==="no_signs_found")note.textContent=tt("vn");
  else note.textContent="";
  return;
 }
 let pos=0;const tacticLabels=new Set();
 for(const region of merged){
  if(region.start>pos)root.append(document.createTextNode(chars.slice(pos,region.start).join("")));
  const mark=document.createElement("span"),labels=[...region.labels];
  mark.className="highlighted"+(region.url?" url":"");
  mark.textContent=chars.slice(region.start,region.end).join("");
  mark.title=[...labels,...(region.url?[tt("linkLabel")]:[])].join(", ");
  mark.setAttribute("aria-label",mark.title);
  mark.tabIndex=0;
  mark.addEventListener("click",()=>tip.textContent=mark.title);
  mark.addEventListener("focus",()=>tip.textContent=mark.title);
  root.append(mark);pos=region.end;
  labels.forEach(label=>tacticLabels.add(label));
 }
 if(pos<chars.length)root.append(document.createTextNode(chars.slice(pos).join("")));
 const legends=[...tacticLabels,...(items.some(s=>s.kind==="url")?[tt("linkLabel")]:[])];
 legend.replaceChildren(...legends.map(label=>{const chip=document.createElement("span");chip.className="chip";chip.textContent=label;return chip}));
}
function mergeSpans(items,length){
 const sorted=items.filter(s=>Number.isInteger(s.start)&&Number.isInteger(s.end)&&s.start>=0&&s.end>s.start&&s.start<length)
  .map(s=>({...s,end:Math.min(s.end,length)})).sort((a,b)=>a.start-b.start||a.end-b.end);
 const merged=[];
 for(const item of sorted){
  const previous=merged[merged.length-1];
  if(previous&&item.start<previous.end){
   previous.end=Math.max(previous.end,item.end);
   if(item.kind==="tactic")previous.labels.add(item.label);
   if(item.kind==="url")previous.url=true;
  }else merged.push({start:item.start,end:item.end,labels:new Set(item.kind==="tactic"?[item.label]:[]),url:item.kind==="url"});
 }
 return merged;
}

function callStatus(answers,questions){
const score=Math.min(100,answers.reduce((sum,a,i)=>{
 const idx=typeof a.questionIndex==="number"?a.questionIndex:i;
 const q=questions[idx];
 return sum+(a.answer==="yes"&&q?q.weight:0);
},0));
return {score,alert:score>=50||answers.some((a,i)=>{const idx=typeof a.questionIndex==="number"?a.questionIndex:i;return a.answer==="yes"&&questions[idx]&&questions[idx].critical;}),complete:answers.length===questions.length};
}
function renderCallGuidance(root,answers,questions){
 const sections=[];
 answers.forEach((answer,i)=>{
  const questionIdx=typeof answer.questionIndex==="number"?answer.questionIndex:i;
  const question=questions[questionIdx];
  if(!question) return;
  const section=document.createElement("section"),heading=document.createElement("h3");
  if(answer.answer==="yes"){
   heading.textContent=question.text[lang];
   const list=document.createElement("ul");
   (question.guidance[lang]||[]).forEach(step=>{const item=document.createElement("li");item.textContent=step;list.append(item)});
   section.append(heading,list);
   if(root.id==="callAlertAdvice"&&question.scenarios){
    const choices=document.createElement("div");choices.className="row";
    question.scenarios.forEach(scenario=>{
     const button=document.createElement("button");
     button.textContent=scenario.label[lang];
     const chosen=callScenarioMap[questionIdx]===scenario.id;
     button.setAttribute("aria-pressed",String(chosen));
     button.onclick=()=>{callScenarioMap[questionIdx]=scenario.id;renderCall();};
     choices.append(button);
    });
    section.append(choices);
    const selected=question.scenarios.find(scenario=>scenario.id===callScenarioMap[questionIdx]);
    if(selected){
     const steps=document.createElement("ol");
     selected.steps[lang].forEach(step=>{const item=document.createElement("li");item.textContent=step;steps.append(item)});
     section.append(steps);
    }
   }
  }
  if(section.childNodes.length)sections.push(section);
 });
 root.replaceChildren(...sections);
}

["callProgress","callQuestion","callProgressbar","callRisk","callChoices","callOtherForm","callAdvice"].forEach(id=>{
 $(id).classList.toggle("hide",showingOtherResponse);
});
$("callOtherResponse").classList.toggle("hide",!showingOtherResponse);
if(showingOtherResponse)renderCallOtherResponse();
const lastYes=callAnswers.reduce((found,a,i)=>{const idx=typeof a.questionIndex==="number"?a.questionIndex:i;return a.answer==="yes"&&callQuestions[idx]&&callQuestions[idx].critical?idx:found;},-1);

$("callCommonSteps").classList.toggle("hide",lastYes===1);
$("callScript").classList.toggle("hide",lastYes===1);
renderCallGuidance($("callAdvice"),callAnswers,callQuestions);
renderCallGuidance($("callAlertAdvice"),callAnswers,callQuestions);
renderCallGuidance($("callCalmAdvice"),callAnswers,callQuestions);
const hasCurrentQuestion=!callAlerted&&!state.complete;
$("callChoices").classList.toggle("hide",showingOtherResponse||!hasCurrentQuestion||callEnteringOther);
$("callOtherForm").classList.toggle("hide",showingOtherResponse||!hasCurrentQuestion||!callEnteringOther);
if(!callAlerted&&!state.complete){

}
